name: Update live profile stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stats.py
      - name: Commit refreshed stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update live competitive programming stats"
